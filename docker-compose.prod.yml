# TrueNAS production shape. The NAS pulls from GHCR; Actions do not deploy.
# Provide DATABASE_URL, BETTER_AUTH_SECRET, BETTER_AUTH_URL (and the optional
# Google / tunnel values) from a host env file the owner maintains.

services:
  flyte-web:
    image: ghcr.io/czekanskyy/flyte-web:${FLYTE_WEB_TAG:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      DATABASE_URL: ${DATABASE_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-https://flyte.czekanski.dev}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      REDIS_URL: redis://flyte-redis:6379
      PDF_SERVICE_URL: http://flyte-pdf:3001
    depends_on:
      - flyte-redis
      - flyte-pdf
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  flyte-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]

  # Playwright/Chromium will fill this in when OFP/FPL print exists.
  flyte-pdf:
    image: ghcr.io/czekanskyy/flyte-pdf:${FLYTE_PDF_TAG:-stub}
    restart: unless-stopped
    build:
      context: ./docker/pdf-stub
      dockerfile: Dockerfile
    environment:
      PORT: "3001"

  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - flyte-web
