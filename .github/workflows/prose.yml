name: prose

# House style gate. Runs from day one, before the application exists, because
# the documentation is the deliverable in Phase 0 and the rule is easier to hold
# than to retrofit across a few thousand lines later.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-prose:
    name: no em-dashes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          # This job only runs `node scripts/lint-prose.mjs`. setup-node v5
          # otherwise reads package.json "packageManager" and looks for pnpm
          # on PATH, which this workflow does not install.
          package-manager-cache: false
      - name: Check for em-dashes
        run: node scripts/lint-prose.mjs
